<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc"><title id="title">One photograph, one linked record</title><desc id="desc">The same captured image supplies the saved JPEG and the model input. The filename links the JPEG to a CSV row.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#607080"/></marker></defs><rect width="1200" height="350" rx="12" fill="#f6f7f8"/><g font-family="Arial, Helvetica, sans-serif" fill="#182c3e"><text x="32" y="42" font-size="25" font-weight="700">One photograph, one linked record</text><rect x="35" y="88" width="310" height="160" rx="10" fill="#e7f1f0" stroke="#c6d1da"/><text x="53" y="123" font-size="21" font-weight="700">Captured frame</text><text x="53" y="160" font-size="18">Save the full JPEG</text><text x="53" y="187" font-size="18">Decode the same image</text><path d="M351 170H405" stroke="#607080" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/><rect x="415" y="88" width="345" height="160" rx="10" fill="#fff" stroke="#c6d1da"/><text x="433" y="123" font-size="21" font-weight="700">Model input</text><text x="433" y="160" font-size="18">Crop the centre and resize</text><text x="433" y="187" font-size="18">Run inference</text><text x="433" y="214" font-size="18">Collect scores for each label</text><path d="M766 170H820" stroke="#607080" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/><rect x="830" y="88" width="335" height="160" rx="10" fill="#fff" stroke="#c6d1da"/><text x="848" y="123" font-size="21" font-weight="700">CSV row</text><text x="848" y="160" font-size="18">image: rec_0001.jpg</text><text x="848" y="187" font-size="18">top label + all scores</text><text x="848" y="214" font-size="18">time since board startup</text><text x="35" y="300" font-size="18">Keep the photo and CSV together. Add the place, model version and camera position to your notes.</text></g></svg>
