<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc"><title id="title">From a search phrase to candidate images</title><desc id="desc">Search settings become an API request; returned metadata leads to downloaded candidate images, which still need review.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#607080"/></marker></defs><rect width="1200" height="350" rx="12" fill="#f6f7f8"/><g font-family="Arial, Helvetica, sans-serif" fill="#182c3e"><text x="32" y="42" font-size="25" font-weight="700">From a search phrase to candidate images</text><rect x="30" y="88" width="245" height="160" rx="10" fill="#fff" stroke="#c6d1da"/><text x="48" y="123" font-size="21" font-weight="700">Your settings</text><text x="48" y="160" font-size="18">label: moss</text><text x="48" y="187" font-size="18">query: "moss wall"</text><path d="M281 170H320" stroke="#607080" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/><rect x="330" y="88" width="245" height="160" rx="10" fill="#e7f1f0" stroke="#c6d1da"/><text x="348" y="123" font-size="21" font-weight="700">API request</text><text x="348" y="160" font-size="18">Service + query</text><text x="348" y="187" font-size="18">credentials + limit</text><path d="M581 170H620" stroke="#607080" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/><rect x="630" y="88" width="245" height="160" rx="10" fill="#fff" stroke="#c6d1da"/><text x="648" y="123" font-size="21" font-weight="700">Response</text><text x="648" y="160" font-size="18">Title and source</text><text x="648" y="187" font-size="18">Image URL / metadata</text><path d="M881 170H920" stroke="#607080" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/><rect x="930" y="88" width="240" height="160" rx="10" fill="#fff" stroke="#c6d1da"/><text x="948" y="123" font-size="21" font-weight="700">Local collection</text><text x="948" y="160" font-size="18">Candidate CSV</text><text x="948" y="187" font-size="18">Image files</text><text x="32" y="300" font-size="18">Next: inspect the images together. A search result is not yet an agreed training example.</text></g></svg>
